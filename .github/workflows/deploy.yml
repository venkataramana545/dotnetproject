name: deploy dotnet pro
on:
    workflow_dispatch
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6

            - name: setup terraform
              uses: hashicorp/setup-terraform@v3
            
            - name: azure login
              uses: azure/login@v1
              with:
                creds: ${{secrets.AZURE_CREDENTIALS}}
            
            - name: terraform init
              run: |
                cd terraform
                terraform init

            - name: terraform validate
              run: |
                cd terraform
                terraform validate
            
            - name: terraform plan
              run: |
                cd terraform
                terraform plan
            
            - name: terraform apply
              run: |
                cd terraform
                terraform apply --auto-approve
            
             - name: setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: |
                  8.0.x
                  9.0.x
                  10.0.x
            
            - name: Restore dependencies
              run: |
                cd NetflicProject
                dotnet restore
            
            - name: build
              run: |
                cd NetflicProject 
                dotnet build 

            - name: publish
              run: |
                cd NetflicProject
                dotnet publish -c Release -o ./publish
            
            - name: deploy to azure webapp
              uses: azure/webapps-deploy@v2
              with:
                app-name: appnum545
                package: ./publish

              

            