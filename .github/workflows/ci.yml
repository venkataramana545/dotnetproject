name: Build dotnet app
on:
    workflow_dispatch

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: |
                  8.0.x
                  9.0.x
                  10.0.x
            
            - name: Restore dependencies
              run: |
                cd NetflicProject
                dotnet restore
            
            - name: build
              run: |
                cd NetflicProject 
                dotnet build 
